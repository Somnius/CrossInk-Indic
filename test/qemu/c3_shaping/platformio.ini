; ESP32-C3 test firmware for QEMU (Espressif's qemu-system-riscv32 -M esp32c3).
; Runs the complex-script shaper the way the X3/X4 (no PSRAM) do and compares
; it with HarfBuzz. See README.md. Not part of the CrossInk firmware build.
[env:c3-shaping]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = ../../../partitions.csv
board_build.flash_size = 16MB
; QEMU's quad-I/O flash emulation shifts esp_partition_read() data by two
; bytes (memory-mapped reads are fine); DIO reads correctly there. Devices
; keep their own mode, this only affects the emulated test image.
board_build.flash_mode = dio
board_upload.flash_size = 16MB
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
  -std=gnu++2a
  -Os
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -I../../../lib/EpdFont
  -I../../../lib/Utf8
  -I../../../lib/InflateReader
  -I../../../lib/uzlib/src
  -I../../../lib/OtShaper
  -I../../../lib/EpdFont/builtinFonts/..
  -I../../complex_shaper
  -Iinclude
